<div class="topbar">
  <div><h1>Job Recommendations Board</h1><div class="sub">Find real placements, internships, and associate vacancies mapped directly to your targeted engineering career role.</div></div>
</div>

<div class="content" style="display: flex; flex-direction: column; gap: 20px;">
  <!-- Job Filtering and Search -->
  <div class="panel reveal" style="padding: 20px; display: flex; flex-direction: row; gap: 15px; align-items: center; flex-wrap: wrap;">
    <div style="flex: 1; min-width: 250px; position: relative;">
      <i class="ti ti-search" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 16px;"></i>
      <input type="text" id="jobSearchInput" placeholder="Search by job title, company, or skills..." style="width: 100%; padding: 12px 16px 12px 42px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-page); color: var(--text); outline: none; font-size: 13.5px;">
    </div>
    <select id="jobTypeFilter" style="padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-page); color: var(--text); outline: none; font-size: 13.5px; min-width: 140px; cursor: pointer;">
      <option value="All">All Job Types</option>
      <option value="Full-time">Full-time</option>
      <option value="Internship">Internship</option>
    </select>
    <select id="jobLocationFilter" style="padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-page); color: var(--text); outline: none; font-size: 13.5px; min-width: 150px; cursor: pointer;">
      <option value="All">All Locations</option>
      <option value="Bengaluru">Bengaluru</option>
      <option value="Hyderabad">Hyderabad</option>
      <option value="Pune">Pune</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Gurgaon">Gurgaon</option>
      <option value="Noida">Noida</option>
      <option value="Chennai">Chennai</option>
    </select>
  </div>

  <!-- Jobs Grid -->
  <div id="jobsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px;">
    <!-- Filled dynamically by jobs.js -->
  </div>
</div>
