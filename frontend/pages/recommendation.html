<style>
  .recs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    overflow-y: auto;
    padding-bottom: 20px;
    min-height: 0;
  }
  .rec-card {
    background: #fff;
    border: 1px solid #ECEDF3;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .rec-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(17,24,39,0.06);
    border-color: #E2E0FF;
  }
  .rec-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .rec-title-wrap h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .rec-family {
    font-size: 10.5px;
    color: #4F46E5;
    background: #EEF0FF;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    display: inline-block;
    margin-top: 4px;
  }
  .score-badge {
    font-size: 16px;
    font-weight: 800;
    color: #16A34A;
    background: #E9F9EF;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(22,163,74,0.12);
  }
  .score-badge.advanced-warning {
    color: #F59E0B;
    background: #FEF6E7;
    box-shadow: 0 4px 10px rgba(245,158,11,0.12);
  }
  .rec-details {
    font-size: 12px;
    line-height: 1.45;
    color: #4B5563;
    margin-bottom: 12px;
  }
  .rec-meta-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: #F9FAFB;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .meta-item {
    font-size: 10.5px;
    color: #6B7280;
  }
  .meta-item strong {
    display: block;
    color: #111827;
    font-size: 11px;
    margin-top: 2px;
  }
  .skills-matchup {
    font-size: 11.5px;
    margin-bottom: 14px;
  }
  .skills-matchup span {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9.5px;
    margin-right: 4px;
    margin-top: 4px;
  }
  .skill-match {
    background: #E9F9EF;
    color: #16A34A;
  }
  .skill-gap {
    background: #FDECEC;
    color: #EF4444;
  }
  .action-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #ECEDF3;
    padding-top: 10px;
    margin-top: auto;
  }
  .btn-primary {
    background: #4F46E5;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-primary:hover {
    background: #3730A3;
  }
  .bridge-alert {
    background: #FEF6E7;
    border: 1px solid #FBEFE0;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 10.5px;
    color: #B45309;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }

<!-- TOPBAR (Dynamic) -->
    <div class="topbar">
      <div>
        <h1>Career Recommendations</h1>
        <p>Personalized matching algorithm based on your skills and goals.</p>
      </div>
    </div>

    <div class="recs-grid reveal" id="recsGrid">
      <div style="grid-column: span 2; text-align: center; padding: 40px; color: #9CA3AF;">

        <p style="margin-top: 10px;">Computing matching matrices...</p>
      </div>
    </div>
