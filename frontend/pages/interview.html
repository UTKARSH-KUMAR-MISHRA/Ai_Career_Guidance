<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Career Guidance — Interview Prep</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="../css/main.css">
<style>
  .interview-shell {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 14px;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .prep-area {
    background: #fff;
    border: 1px solid #ECEDF3;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 0;
    overflow: hidden;
  }
  .results-area {
    background: #fff;
    border: 1px solid #ECEDF3;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow-y: auto;
  }
  .q-navigator {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ECEDF3;
    padding-bottom: 10px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .q-navigator h4 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
  }
  .btn-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #ECEDF3;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    transition: background .2s;
  }
  .btn-circle:hover {
    background: #F9FAFB;
    color: #4F46E5;
    border-color: #D8D6FF;
  }
  .question-box {
    background: #FAFAFF;
    border: 1px solid #EBF5FF;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .question-box p {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
  }
  .answer-textarea {
    flex: 1;
    border: 1px solid #ECEDF3;
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    resize: none;
    transition: border-color .2s, box-shadow .2s;
    margin-bottom: 12px;
  }
  .answer-textarea:focus {
    border-color: #4F46E5;
    box-shadow: 0 0 0 3px #EEF0FF;
  }
  .keyword-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .keyword-tag {
    font-size: 9.5px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .keyword-tag.matched {
    background: #E9F9EF;
    color: #16A34A;
  }
  .keyword-tag.missing {
    background: #FDECEC;
    color: #EF4444;
  }
  .btn-recommended {
    background: #fff;
    color: #4F46E5;
    border: 1px solid #4F46E5;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, color .2s;
    margin-top: 6px;
  }
  .btn-recommended:hover {
    background: #EEF0FF;
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR (Dynamic) -->
  <div class="sidebar"></div>

  <!-- MAIN Shell -->
  <div class="main">
    <!-- TOPBAR (Dynamic) -->
    <div class="topbar">
      <div>
        <h1>Interview Preparation</h1>
        <p>Select your target role and answer mock screening questions.</p>
      </div>
    </div>

    <!-- Interview Workspace -->
    <div class="interview-shell reveal">
      
      <!-- Left: Prep viewport -->
      <div class="prep-area">
        <div class="q-navigator">
          <h4 id="qNumberLabel">Question 1 of 0</h4>
          <div style="display:flex; gap:6px;">
            <button class="btn-circle" id="prevQBtn" title="Previous Question"><i class="ti ti-chevron-left"></i></button>
            <button class="btn-circle" id="nextQBtn" title="Next Question"><i class="ti ti-chevron-right"></i></button>
          </div>
        </div>

        <div class="question-box">
          <span style="font-size:9.5px; font-weight:700; color:#4F46E5; background:#EEF0FF; padding:2px 6px; border-radius:4px; margin-bottom:6px; display:inline-block;" id="qMetaLabel">TECHNICAL</span>
          <p id="questionText">Loading question...</p>
        </div>

        <strong style="font-size:11.5px; color:#4B5563; margin-bottom:4px;">Draft your response:</strong>
        <textarea class="answer-textarea" id="studentAnswerText" placeholder="Write your comprehensive technical explanation here..."></textarea>

        <button class="btn-primary" id="gradeAnswerBtn" style="padding:10px 14px; width:100%;">Submit & Score Answer <i class="ti ti-circle-check"></i></button>
      </div>

      <!-- Right: Evaluation results -->
      <div class="results-area">
        <div style="display:flex; align-items:center; gap:6px; border-bottom:1px solid #ECEDF3; padding-bottom:8px; flex-shrink:0;">
          <i class="ti ti-chart-bar" style="color:#4F46E5; font-size:16px;"></i>
          <h3 style="font-size:13px; margin:0; font-weight:700;">Score & Feedback</h3>
        </div>

        <div id="resultsContent" style="display:flex; flex-direction:column; gap:12px;">
          <!-- Empty default state -->
          <div style="text-align:center; padding:40px 10px; color:#9CA3AF; font-size:11.5px;">
            Draft your explanation and submit the answer to calculate matching keywords and retrieve mentor grade evaluations.
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toastMsg">Saved</span></div>

<script src="../js/navigation.js"></script>
<script src="../js/interview.js"></script>
</body>
</html>
